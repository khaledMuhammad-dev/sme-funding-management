    <circle cx="74" cy="25" r="8.74"/>
    <circle cx="115" cy="25" r="10.42"/>
    <circle cx="163" cy="25" r="11.59"/>
    <circle cx="218" cy="25" r="11.42"/>
    <circle cx="218" cy="79" r="10.25"/>
