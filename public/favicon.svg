<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 13 212 224" width="32" height="32">
  <!--
    Same artwork as src/components/shared/BrandMark.tsx, at tab size.
    A favicon has no `currentColor` to inherit, so both themes are declared here;
    strokes and dots carry the same small-size optical boost the component
    applies at 32px (stroke 8.05 units, dot radii x1.68).
  -->
  <style>
    :root { --ink: #2c3650; }
    @media (prefers-color-scheme: dark) { :root { --ink: #efe7d9; } }
    .ink { fill: var(--ink); }
    .stroke { fill: none; stroke: var(--ink); stroke-width: 8.05; stroke-linecap: round; }
    .wedge { fill: var(--ink); opacity: 0.13; }
  </style>

  <g class="wedge">
    <path d="M31 25 L57 21 L31 94 Z"/>
    <path d="M74 25 L97 21 L31 127 Z"/>
    <path d="M115 25 L140 21 L31 167 Z"/>
    <path d="M163 25 L191 21 L31 207 Z"/>
    <path d="M218 25 L222 50 L35 230 Z"/>
    <path d="M218 79 L222 104 L68 230 Z"/>
    <path d="M218 129 L222 154 L98 230 Z"/>
    <path d="M218 176 L224.1 200.9 L130 230 Z"/>
    <path d="M221 212 L226.5 230 L169 230 Z"/>
  </g>

  <g class="stroke">
    <path d="M31.5 25 L31.5 93"/>
    <path d="M74 25 L31 126"/>
    <path d="M115 25 L31 166"/>
    <path d="M163 25 L31 206"/>
    <path d="M218 25 L35 230"/>
    <path d="M218 79 L68 230"/>
    <path d="M218 129 L98 230"/>
    <path d="M218 176 L130 230"/>
    <path d="M221 212 L169 230"/>
  </g>

  <g class="ink">
